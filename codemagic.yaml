workflows:
  default-workflow:
    name: Solo Leveling Mobile Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.9
      xcode: latest
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter test
        script: |
          flutter test
      - name: Build iOS and package IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y SoloLevelling.ipa Payload
          mv SoloLevelling.ipa $CM_BUILD_DIR/
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - SoloLevelling.ipa
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - john.jpg777@gmail.com
        notify:
          success: true
          failure: true
