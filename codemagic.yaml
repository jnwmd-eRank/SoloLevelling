workflows:
  default-workflow:
    name: Solo Leveling Mobile Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.9
      xcode: latest
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter test
        script: |
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build iOS (No codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - john.jpg777@gmail.com
        notify:
          success: true
          failure: true
